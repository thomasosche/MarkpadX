name: Navigation test executable (no release)

on:
  pull_request:
    paths:
      - 'src/lib/components/Editor.svelte'
      - 'src/lib/MarkdownViewer.svelte'
      - 'src/lib/utils/selection.ts'
      - 'src/lib/utils/clipboard.ts'
      - 'tests/**'
      - '.github/workflows/navigation_test_build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare medium-integrity UI test process
        # WebView2 ignores debugger environment flags for elevated hosts.
        # Matches Tauri's own Windows E2E strategy; changes only this disposable runner.
        run: |
          winget install gerardog.gsudo --accept-source-agreements --accept-package-agreements --silent
          if ($LASTEXITCODE -ne 0) { throw 'gsudo installation failed' }
          $locations = @("$env:ProgramFiles\gsudo", "${env:ProgramFiles(x86)}\gsudo", 'C:\tools\gsudo')
          $exe = $locations | Where-Object { Test-Path -LiteralPath $_ } |
            ForEach-Object { Get-ChildItem -LiteralPath $_ -Filter gsudo.exe -File -Recurse } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw 'Installed gsudo executable not found' }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'gsudo executable validation failed' }
          icacls "$env:GITHUB_WORKSPACE" /grant "${env:USERNAME}:(OI)(CI)F"
          if ($LASTEXITCODE -ne 0) { throw 'Test workspace permissions failed' }
          "GSUDO_EXE=$exe" >> $env:GITHUB_ENV
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          "TEST_NODE_EXE=$node" >> $env:GITHUB_ENV
          & $exe --integrity Medium $node --version
          if ($LASTEXITCODE -ne 0) { throw 'Medium-integrity Node launch failed' }
          $tempRoot = & $node -p "require('node:os').tmpdir()"
          "NAVIGATION_LOGS=$tempRoot\markpadx-e2e" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Build standalone debug executable
        run: npm run tauri build -- --debug --no-bundle
      - name: Rust regression tests
        working-directory: src-tauri
        run: cargo test
      - name: Existing native selection and search regression suites
        run: |
          & $env:GSUDO_EXE --integrity Medium $env:TEST_NODE_EXE tests/e2e/run.mjs carry tabsearch
          exit $LASTEXITCODE
      - name: Preserve native-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Navigation-test-logs
          path: ${{ env.NAVIGATION_LOGS }}/*/logs/*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Markpad-navigation-test
          path: src-tauri/target/debug/Markpad.exe
          if-no-files-found: error
          retention-days: 7
